[package]
name = "sidestep"
version = "1.0.0"
edition = "2021"
license = "GPL-3.0-or-later"

[[bin]]
name = "Sidestep"
path = "src/main.rs"

[lib]
name = "sidestep_core"
path = "src/lib.rs"

[target.'cfg(windows)'.dependencies]
nwg = { package = "native-windows-gui", version = "1.0.13", features = ["high-dpi"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
eframe = { version = "0.31", default-features = true }
image = { version = "0.25", default-features = false, features = ["ico", "png"] }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", features = ["blocking"] }

[target.'cfg(target_os = "macos")'.dependencies]
tray-icon = "0.19"

[features]
# Layout-check build: asInvoker manifest, --preview-main N / --preview-setup only.
preview = []

[build-dependencies]
embed-manifest = "1.4.0"
embed-resource = "2.4.2"

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
